# Apache Maven Wrapper - variante "only-script": non richiede alcun jar nel repository.
# Al primo ./mvnw lo script scarica questa distribuzione di Maven sotto ~/.m2/wrapper/dists
# e da quel momento la riusa.
#
# Per cambiare versione di Maven basta modificare la riga distributionUrl.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
