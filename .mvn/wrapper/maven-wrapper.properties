# Apache Maven Wrapper, "only-script" variant: no jar is needed in the repository.
# On the first ./mvnw run the script downloads this Maven distribution under ~/.m2/wrapper/dists
# and reuses it from then on.
#
# To change the Maven version, edit the distributionUrl line.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
